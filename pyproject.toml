[project]
name = "isop-utils"
version = "0.1.0"
description = "A simple package to read ISOP 3D image (3DU16)"
authors = [{ name = "Chung-Kuan Chen", email = "b97b01045@gmail.com" }]
dependencies = ["numpy", "attrs", "tifffile", "h5py", "hdf5plugin"]
readme = "README.md"
requires-python = ">= 3.10"
urls = { github = "https://github.com/lycantrope/scape_utils" }

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff.lint]
extend-select = ["I001"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
